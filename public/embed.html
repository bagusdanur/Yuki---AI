<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuki</title>
  <!-- Embed memakai aplikasi utama agar desain selalu identik, tetapi dikunci ke mode Teman Ngobrol. -->
  <script>
    (() => {
      const target = new URL('/', window.location.origin)
      const current = new URLSearchParams(window.location.search)
      current.forEach((value, key) => target.searchParams.set(key, value))
      target.searchParams.set('embed', '1')
      window.location.replace(target.toString())
    })()
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/?embed=1" /></noscript>
</head>

<body>
  <p>Mengalihkan ke Yuki…</p>
</body>

</html>
